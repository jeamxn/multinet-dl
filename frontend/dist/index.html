<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MultiNet Downloader</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="drag" style="--wails-draggable:drag"></div>

    <div class="group">
      <div class="group-head">
        <h2>네트워크</h2>
        <button class="text-btn" id="testBtn" title="고른 네트워크가 실제로 인터넷에 나가는지 확인">연결 확인</button>
        <button class="icon-btn" id="refreshBtn" title="네트워크 다시 찾기" aria-label="네트워크 다시 찾기">
          <svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></svg>
        </button>
      </div>
      <ul class="nets" id="nets" role="list"></ul>
      <button class="reveal-virtual" id="virtualBtn"></button>
      <p class="note" id="bindNote"></p>
    </div>

    <div class="group">
      <div class="group-head"><h2 id="connsLabel">네트워크당 연결</h2></div>
      <div class="conns">
        <input type="range" id="conns" min="1" max="64" step="1" value="8" aria-labelledby="connsLabel" />
        <output id="connsOut" for="conns">8</output>
      </div>
      <p class="note quiet" id="connsHint"></p>
    </div>

    <div class="group">
      <div class="group-head"><h2>저장 위치</h2></div>
      <button class="folder" id="dirBtn" title="폴더 바꾸기">
        <svg viewBox="0 0 16 16"><path d="M1.5 4.5a1 1 0 0 1 1-1h3.2l1.3 1.5h6.5a1 1 0 0 1 1 1v6.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/></svg>
        <span class="folder-name" id="dirName"></span>
        <span class="folder-path" id="dirPath"></span>
      </button>
      <button class="text-btn left" id="dirOpen">Finder에서 열기</button>
    </div>

    <div class="cli-line" id="cliInfo"></div>
  </aside>

  <section class="content">
    <header class="toolbar" style="--wails-draggable:drag">
      <form class="address" id="composer" autocomplete="off" style="--wails-draggable:no-drag">
        <svg class="address-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8.5M4.5 7 8 10.5 11.5 7M3 13.5h10"/></svg>
        <textarea id="urls" rows="1" spellcheck="false" aria-label="다운로드 주소" placeholder="다운로드 주소를 붙여넣으세요"></textarea>
        <button type="button" class="chip-btn" id="optToggle" aria-expanded="false" aria-controls="options">옵션</button>
        <button type="submit" class="go" id="goBtn">받기</button>
      </form>
    </header>
    <div class="options" id="options" hidden>
      <label><span>파일 이름</span><input id="fileName" type="text" spellcheck="false" placeholder="비워두면 서버가 알려주는 이름" /></label>
      <label><span>요청 헤더</span><textarea id="headers" rows="2" spellcheck="false" placeholder="한 줄에 하나씩, 예: Cookie: session=abc"></textarea></label>
    </div>
    <div class="form-msg" id="formMsg" role="status"></div>

    <div class="downloads">
      <div class="list-head" role="row">
        <span>파일</span><span class="r">크기</span><span class="r">속도</span><span class="r">남은 시간</span><span></span>
      </div>
      <div class="list" id="list" role="listbox" tabindex="0" aria-label="다운로드 목록"></div>
      <div class="list-foot">
        <span id="summary"></span>
        <button class="text-btn" id="clearBtn">끝난 항목 정리</button>
      </div>
    </div>

    <section class="inspector" id="inspector" aria-live="off"></section>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
